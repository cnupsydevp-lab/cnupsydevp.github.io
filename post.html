<script>
document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const page = params.get('page');
  const id = parseInt(params.get('id'), 10);

  const PAGE_META = {
    notices: { eyebrow: 'Announcements', title: '공지사항', navHref: 'notices.html' },
    participation: { eyebrow: 'Research Participation', title: '연구참여', navHref: 'participation.html' },
    newsletter: { eyebrow: 'Newsletter', title: '소식지', navHref: 'newsletter.html' }
  };

  const meta = PAGE_META[page];
  if (!meta) {
    document.getElementById('post-body').innerHTML = '<p class="empty-note">잘못된 페이지 요청입니다.</p>';
    return;
  }

  const post = (typeof POSTS !== 'undefined') && POSTS[page] && POSTS[page].find(p => p.id === id);

  document.getElementById('post-eyebrow').textContent = meta.eyebrow;
  document.getElementById('post-page-title').textContent = meta.title;
  document.getElementById('post-back').href = meta.navHref;

  const navLink = document.querySelector(`.nav-links a[href="${meta.navHref}"]`);
  if (navLink) {
    navLink.classList.add('active');
    const parentDropdown = navLink.closest('.nav-dropdown');
    if (parentDropdown) parentDropdown.querySelector('.nav-dropdown-btn').classList.add('active');
  }

  if (!post) {
    document.getElementById('post-body').innerHTML = '<p class="empty-note">게시글을 찾을 수 없습니다.</p>';
    return;
  }

  document.title = `DPWL — ${post.title}`;

  const badge = document.getElementById('post-badge');
  badge.className = `badge ${post.badge}`;
  badge.textContent = post.badgeText;

  document.getElementById('post-title').textContent = post.title;
  document.getElementById('post-body').innerHTML = post.body;

  /* ── 좋아요 ───────────────────────────────────────────────────
     서버가 없는 정적 사이트(GitHub Pages)라 상태를 방문자의 브라우저
     (localStorage)에 저장한다. 따라서 '이 브라우저에서 눌렀는지'만 남고
     방문자끼리 합산되지 않는다 — 전체 좋아요 수가 아니라 내 표시다.
     (조회수는 같은 이유로 방문자별 값이 되어 공개 지표가 못 되므로 두지 않는다)
     전체 합계가 필요해지면 아래 읽기·쓰기 두 곳만 서버 API 호출로 바꾸면 되고
     화면 코드는 그대로 쓴다.

     저장이 막힌 환경(사파리 프라이빗 등)에서도 화면이 깨지지 않게 try 로 감싼다.
     ─────────────────────────────────────────────────────────── */
  const LIKE_KEY = `dpwl_liked_${page}_${id}`;

  // 토글 버튼. 상태는 aria-pressed 로 알려 준다(스크린리더가 '눌림'으로 읽는다)
  const likeBtn   = document.getElementById('post-like');
  const likeCount = document.getElementById('post-like-count');
  let liked = false;
  try { liked = localStorage.getItem(LIKE_KEY) === '1'; } catch (e) { /* 무시 */ }

  function paintLike() {
    likeBtn.setAttribute('aria-pressed', liked ? 'true' : 'false');
    likeCount.textContent = liked ? '1' : '';
    likeCount.hidden = !liked;
  }
  paintLike();
  document.getElementById('post-like-row').hidden = false;

  likeBtn.addEventListener('click', () => {
    liked = !liked;
    try {
      if (liked) localStorage.setItem(LIKE_KEY, '1');
      else localStorage.removeItem(LIKE_KEY);
    } catch (e) { /* 저장이 막혀도 이번 화면에서는 눌린 상태로 보인다 */ }
    paintLike();
  });
});
</script>
